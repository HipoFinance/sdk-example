# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
    # Runs on pushes targeting the default branch
    push:
        branches: ['main']

    # Allows you to run this workflow manually from the Actions tab
    workflow_dispatch:

# Sets the GITHUB_TOKEN permissions to allow deployment to GitHub Pages
permissions:
    contents: read
    pages: write
    id-token: write

# Allow one concurrent deployment
concurrency:
    group: 'pages'
    cancel-in-progress: true

jobs:
    # Single deploy job since we're just deploying
    deploy:
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Set up Node
              uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: 'npm'
            - name: Install dependencies
              run: npm ci
            - name: Build
              run: npm run build
            - name: Setup Pages
              uses: actions/configure-pages@v6
            - name: Upload artifact
              uses: actions/upload-pages-artifact@v5
              with:
                  # Upload dist repository
                  path: './dist'
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v5

            # This page is 22 characters of static HTML and 238 once React has run, so almost
            # everything here is JavaScript and a deploy that responds tells you nothing at all.
            # The sibling website proved that on 2026-09-08: one import moved @ton/core ahead of a
            # polyfill, every app page served 200 with a full shell and rendered nothing, and the
            # build and the deploy both passed.
            #
            # The assertions are labels, never numbers. "APY" and "Exchange rate" only appear once
            # the SDK has read the treasury over the network, so a pass means the chain layer ran.
            # The values beside them move every settlement release -- they were 12.33% and 1.1644
            # yesterday and are 13.69% and 1.1648 today -- so pinning one would fail within hours
            # and teach everyone to ignore this check.
            - name: Verify the deployed page actually renders
              run: |
                  node scripts/render-check.mjs \
                    --min-text=150 \
                    --expect='APY' \
                    --expect='Exchange rate' \
                    https://sdk-example.hipo.finance/
